##############################################################################
# cloudbuild-web.yaml — 只构建主平台镜像（跳过沙箱镜像）
# 适用于只改了 web/ 或 server/ 的快速部署
# 用法: bash deploy-web.sh  或  gcloud builds submit --config cloudbuild-web.yaml .
##############################################################################

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
# region 必须通过 gcloud builds submit --region 指定，见 deploy-web.sh

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    env: [DOCKER_BUILDKIT=1]
    args:
      - build
      - --cache-from
      - asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:latest
      - --build-arg
      - BUILDKIT_INLINE_CACHE=1
      - -t
      - asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:$BUILD_ID
      - -t
      - asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args: [push, --all-tags, asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform]
    waitFor: [build]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - skill-platform
      - --image=asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:$BUILD_ID
      - --region=asia-east1
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=1
      - --max-instances=3
      - --no-cpu-throttling
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=gen-lang-client-0884226164,GCP_REGION=asia-east1,DB_SCHEMA=skill_platform,ACTIVE_AGENT_ID=health-advisor,SERVICE_URL=https://skill-platform-yo5337ccva-de.a.run.app,PUBLIC_BASE_URL=https://skill-platform-yo5337ccva-de.a.run.app,SANDBOX_SECRET=sandbox-secret-2024,SANDBOX_JOB_IMAGE=asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/sandbox:latest,OAUTH_REDIRECT_URI=https://skill-platform-yo5337ccva-de.a.run.app/oauth-callback.html,LLMWIKI_BASE=https://llmwiki-yo5337ccva-an.a.run.app,SANDBOX_SERVICE_URL=https://sandbox-service-yo5337ccva-de.a.run.app,CUA_SEND_URL=http://34.139.73.197,JUHE_SEND_URL=https://juhe-api-339795034470.asia-east1.run.app,DOUBAO_BASE_URL=https://ark.cn-beijing.volces.com/api/v3,ARK_MODEL=deepseek-v4-flash-ga-260731
      - --set-secrets=DATABASE_URL=skill-platform-db-url:latest,DOUBAO_API_KEY=skill-platform-doubao-key:latest,DEEPSEEK_API_KEY=skill-platform-deepseek-key:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,TAVILY_API_KEY=TAVILY_API_KEY:latest
    waitFor: [push]

images:
  - asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:$BUILD_ID
  - asia-east1-docker.pkg.dev/gen-lang-client-0884226164/skill-platform/platform:latest
